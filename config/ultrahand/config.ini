; Ultrahand engine configuration for the 4IFIR bundle.
;
; The path in this repository mirrors the path on the SD card: config\ultrahand\config.ini.
; It ships in the engine archive and in local build bundles.
;
; WHY THIS FILE EXISTS AT ALL. Without it the engine falls back to its own built-in
; default, ZL+ZR+Down (utils.hpp:221, defaultCombos[0]). No real-world build opens that
; way: both 4IFIR and Ebal set L+R+Up. So anyone installing the bundle would be pressing
; something other than what the README and INSTALL.txt promise.
;
; ONLY WHAT WE ACTUALLY DECIDE LIVES HERE. The engine writes the other fifty-odd keys
; itself, with its own defaults, on first run — there is no reason to impose ours.

[ultrahand]

; The key combination. Same one that opened Uberhand, so that nothing changes under the
; hands of someone migrating from the old 4IFIR Wizard.
; DUP = D-pad Up. Matches 4ifir (L+DUP+R) and Ebal (L+R+DUP).
; IMPORTANT: the combination in config\tesla\config.ini must match, otherwise two
; overlays fight over the same buttons.
key_combo=L+R+DUP

; Lets other overlays keep their own combinations. Without it 4IFIR.ovl cannot be moved
; to a key of its own and it collides with this menu.
launch_combos=true

; DO NOT ENABLE. It swaps nx-ovlloader for the stock one, which has no MapIo permissions,
; after which InfoNX and other overlays that read hardware registers stop working — and
; the only way back is replacing the loader by hand. It sits here as an explicit false
; precisely so that it does not get switched on by accident.
memory_expansion=false

; The tuner's interface is English — a deliberate choice for an international audience.
default_lang=en
